name: Release APK

on:
  push:
    tags:
      # versionName tags, e.g. 2026.09.07.1
      - "[0-9][0-9][0-9][0-9].*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build release APK
    runs-on: ubuntu-latest
    env:
      KEYSTORE: ${{ github.workspace }}/keystore.jks

    steps:
      - name: Checkout exact release tag
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Decode release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.QURANAPP_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::Missing secret QURANAPP_KEYSTORE_BASE64"
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$KEYSTORE"

      - name: Make Gradle executable
        run: chmod +x ./gradlew

      - name: Build signed release APK
        env:
          QURANAPP_KEYSTORE_FILE: ${{ env.KEYSTORE }}
          QURANAPP_KEYSTORE_PASSWORD: ${{ secrets.QURANAPP_KEYSTORE_PASSWORD }}
          QURANAPP_KEY_ALIAS: ${{ secrets.QURANAPP_KEY_ALIAS }}
          QURANAPP_KEY_PASSWORD: ${{ secrets.QURANAPP_KEY_PASSWORD }}
        run: |
          if [ -z "$QURANAPP_KEYSTORE_PASSWORD" ] || [ -z "$QURANAPP_KEY_ALIAS" ] || [ -z "$QURANAPP_KEY_PASSWORD" ]; then
            echo "::error::Missing one or more signing secrets (QURANAPP_KEYSTORE_PASSWORD, QURANAPP_KEY_ALIAS, QURANAPP_KEY_PASSWORD)"
            exit 1
          fi
          ./gradlew --no-daemon --stacktrace assembleRelease

      - name: Prepare release artifacts
        run: |
          OUT="app/build/outputs"

          OUTPUT="${OUT}/apk/release"
          MAPPING="${OUT}/mapping/release/mapping.txt"

          APK="${OUTPUT}/app-release.apk"
          RELEASE_APK="${OUTPUT}/QuranApp-${GITHUB_REF_NAME}.apk"
          CHECKSUM="${OUTPUT}/SHA256SUMS.txt"

          test -f "$APK"
          test -f "$MAPPING"

          cp "$APK" "$RELEASE_APK"

          sha256sum "$RELEASE_APK" > "$CHECKSUM"

          gzip -9 -k "$MAPPING"

          {
            echo "RELEASE_APK=${RELEASE_APK}"
            echo "CHECKSUM=${CHECKSUM}"
            echo "MAPPING_GZ=${MAPPING}.gz"
          } >> "$GITHUB_ENV"

      - name: Create draft release and upload APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            "$RELEASE_APK" \
            "$CHECKSUM" \
            "$MAPPING_GZ" \
            --draft \
            --verify-tag \
            --title "v${GITHUB_REF_NAME}" \
            --generate-notes

      - name: Remove keystore
        if: always()
        run: rm -f "$KEYSTORE"
