name: Release APK

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout exact release tag
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Decode release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.QURANAPP_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::Missing secret QURANAPP_KEYSTORE_BASE64"
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "${GITHUB_WORKSPACE}/keystore.jks"

      - name: Make Gradle executable
        run: chmod +x ./gradlew

      - name: Build signed release APK
        env:
          QURANAPP_KEYSTORE_FILE: ${{ github.workspace }}/keystore.jks
          QURANAPP_KEYSTORE_PASSWORD: ${{ secrets.QURANAPP_KEYSTORE_PASSWORD }}
          QURANAPP_KEY_ALIAS: ${{ secrets.QURANAPP_KEY_ALIAS }}
          QURANAPP_KEY_PASSWORD: ${{ secrets.QURANAPP_KEY_PASSWORD }}
        run: |
          if [ -z "$QURANAPP_KEYSTORE_PASSWORD" ] || [ -z "$QURANAPP_KEY_ALIAS" ] || [ -z "$QURANAPP_KEY_PASSWORD" ]; then
            echo "::error::Missing one or more signing secrets (QURANAPP_KEYSTORE_PASSWORD, QURANAPP_KEY_ALIAS, QURANAPP_KEY_PASSWORD)"
            exit 1
          fi
          ./gradlew --no-daemon --stacktrace assembleRelease

      - name: Verify signed APK exists
        run: |
          test -f app/build/outputs/apk/release/app-release.apk

      - name: Rename APK
        run: |
          cp \
            app/build/outputs/apk/release/app-release.apk \
            "app/build/outputs/apk/release/QuranApp-${GITHUB_REF_NAME}.apk"

      - name: Generate SHA-256
        run: |
          sha256sum \
            "app/build/outputs/apk/release/QuranApp-${GITHUB_REF_NAME}.apk" \
            > app/build/outputs/apk/release/SHA256SUMS.txt

      - name: Create draft release and upload APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            "app/build/outputs/apk/release/QuranApp-${GITHUB_REF_NAME}.apk" \
            "app/build/outputs/apk/release/SHA256SUMS.txt" \
            --draft \
            --verify-tag \
            --title "${GITHUB_REF_NAME}" \
            --generate-notes

      - name: Remove keystore
        if: always()
        run: rm -f "${GITHUB_WORKSPACE}/keystore.jks"
